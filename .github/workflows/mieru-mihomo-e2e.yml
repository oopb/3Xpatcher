name: Mieru Mihomo E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - UPSTREAM_COMPAT
      - MIERU_VERSION
      - internal/mieru/**
      - overlay/internal/mieru/**
      - overlay/internal/sub/mieru_*
      - scripts/**
      - .github/workflows/mieru-mihomo-e2e.yml
  push:
    branches: [main]
    paths:
      - UPSTREAM_COMPAT
      - MIERU_VERSION
      - internal/mieru/**
      - overlay/internal/mieru/**
      - overlay/internal/sub/mieru_*
      - scripts/**
      - .github/workflows/mieru-mihomo-e2e.yml

permissions:
  contents: read

concurrency:
  group: mieru-mihomo-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mieru-mihomo-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Xpatcher
        uses: actions/checkout@v7

      - name: Read pinned targets
        id: target
        shell: bash
        run: |
          set -euo pipefail
          upstream=$(tr -d '\r\n' < UPSTREAM_COMPAT)
          mieru=$(tr -d '\r\n' < MIERU_VERSION)
          [[ "$upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$mieru" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "mieru=$mieru" >> "$GITHUB_OUTPUT"

      - name: Download matching 3x-ui source
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          curl -fL --retry 5 --retry-all-errors \
            "https://codeload.github.com/MHSanaei/3x-ui/tar.gz/${{ steps.target.outputs.upstream }}" \
            -o /tmp/3x-ui.tar.gz
          tar -xzf /tmp/3x-ui.tar.gz -C source --strip-components=1

      - name: Apply production overlay and E2E test
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/apply-overlay.sh "$GITHUB_WORKSPACE/source"
          cp overlay/internal/mieru/mieru_mihomo_e2e_test.go source/internal/mieru/mieru_mihomo_e2e_test.go

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: Provision official mita runtime account
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd --system mita 2>/dev/null || true
          id -u mita >/dev/null 2>&1 || sudo useradd --system --gid mita --home-dir /nonexistent --shell /usr/sbin/nologin mita
          sudo mkdir -p /var/lib/mita
          sudo chown -R mita:mita /var/lib/mita
          sudo chmod 0775 /var/lib/mita
          getent passwd mita
          getent group mita
          stat -c '%U:%G %a %n' /var/lib/mita

      - name: Download verified official Mieru mita
        id: mieru
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.target.outputs.mieru }}'
          plain=${version#v}
          asset="mita_${plain}_amd64.deb"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://api.github.com/repos/enfein/mieru/releases/tags/${version}" \
            -o /tmp/mieru-release.json
          mapfile -t meta < <(python3 - /tmp/mieru-release.json "$asset" <<'PY'
          import json, sys
          path, name = sys.argv[1:]
          release = json.load(open(path, encoding="utf-8"))
          asset = next((a for a in release.get("assets", []) if a.get("name") == name), None)
          if not asset:
              raise SystemExit(f"missing Mieru asset: {name}")
          print(asset.get("browser_download_url", ""))
          print(asset.get("digest", "") or "")
          PY
          )
          [[ ${#meta[@]} -eq 2 && "${meta[1]}" =~ ^sha256:([0-9a-fA-F]{64})$ ]]
          expected="${BASH_REMATCH[1]}"
          curl -fL --retry 5 --retry-all-errors "${meta[0]}" -o /tmp/mita.deb
          actual=$(sha256sum /tmp/mita.deb | awk '{print $1}')
          [[ "${actual,,}" == "${expected,,}" ]]
          rm -rf /tmp/mita-root
          mkdir -p /tmp/mita-root
          dpkg-deb -x /tmp/mita.deb /tmp/mita-root
          bin=$(find /tmp/mita-root -type f -path '*/bin/mita' -perm -u+x | head -n1)
          [[ -n "$bin" ]]
          "$bin" version
          echo "binary=$bin" >> "$GITHUB_OUTPUT"

      - name: Download verified official Mihomo
        id: mihomo
        shell: bash
        run: |
          set -euo pipefail
          version=v1.19.30
          asset="mihomo-linux-amd64-${version}.gz"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${version}" \
            -o /tmp/mihomo-release.json
          mapfile -t meta < <(python3 - /tmp/mihomo-release.json "$asset" <<'PY'
          import json, sys
          path, name = sys.argv[1:]
          release = json.load(open(path, encoding="utf-8"))
          asset = next((a for a in release.get("assets", []) if a.get("name") == name), None)
          if not asset:
              raise SystemExit(f"missing Mihomo asset: {name}")
          print(asset.get("browser_download_url", ""))
          print(asset.get("digest", "") or "")
          PY
          )
          [[ ${#meta[@]} -eq 2 && "${meta[1]}" =~ ^sha256:([0-9a-fA-F]{64})$ ]]
          expected="${BASH_REMATCH[1]}"
          curl -fL --retry 5 --retry-all-errors "${meta[0]}" -o /tmp/mihomo.gz
          actual=$(sha256sum /tmp/mihomo.gz | awk '{print $1}')
          [[ "${actual,,}" == "${expected,,}" ]]
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod 0755 /tmp/mihomo
          /tmp/mihomo -v
          echo "binary=/tmp/mihomo" >> "$GITHUB_OUTPUT"

      - name: Real Mieru through Mihomo plus traffic metrics
        working-directory: source
        env:
          MIERU_E2E_BINARY: ${{ steps.mieru.outputs.binary }}
          MIHOMO_E2E_BINARY: ${{ steps.mihomo.outputs.binary }}
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/mieru -run '^TestMieruMihomoE2E$' -count=1 -v
