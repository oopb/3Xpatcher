name: Validate V11.4 official compatibility

on:
  push:
    branches: [v11.4-official-compat]
  workflow_dispatch:

concurrency:
  group: v11-4-official-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Xpatcher
        uses: actions/checkout@v7

      - name: Static smoke
        run: ./tests/smoke.sh

      - name: Download matching 3x-ui source
        shell: bash
        run: |
          set -euo pipefail
          target=$(tr -d '\r\n' < UPSTREAM_COMPAT)
          mkdir source
          curl -fL --retry 5 --retry-all-errors "https://codeload.github.com/MHSanaei/3x-ui/tar.gz/${target}" -o /tmp/3x-ui.tar.gz
          tar -xzf /tmp/3x-ui.tar.gz -C source --strip-components=1

      - name: Apply overlay
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/apply-overlay.sh "$GITHUB_WORKSPACE/source"
          cp overlay/internal/sub/singbox_links_test.go source/internal/sub/singbox_links_test.go
          cp overlay/frontend/src/test/supplemental-links.test.ts source/frontend/src/test/supplemental-links.test.ts
          grep -q 'clientUserAgent string' source/internal/sub/service.go
          grep -q 'subReq.clientUserAgent = userAgent' source/internal/sub/controller.go

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test official-source client compatibility
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/sub -run 'TestShadowrocketShadowTLSUsesDescriptorNotSIP003|TestGenericShadowTLSKeepsSIP003Only|TestShadowrocketNaiveMirrorsSuiHTTP2Link|TestGenericNaiveUsesNetworkSpecificNativeScheme|TestTUICClashRestoresPreMieruShapeAndSuiH3' -count=1
          go test ./internal/singbox -count=1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Test frontend links and production build
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test -- src/test/supplemental-links.test.ts
          npm run build
