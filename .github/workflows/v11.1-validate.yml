name: Validate V11.1 installer hotfix

on:
  push:
    branches: [v11.1-singbox-installer-rollback]
  workflow_dispatch:

concurrency:
  group: v11-1-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Xpatcher
        uses: actions/checkout@v7

      - name: Static smoke
        run: ./tests/smoke.sh

      - name: Verify installer syntax and transaction guards
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install-singbox.sh install.sh
          grep -q '^ProtectHome=false$' scripts/install-singbox.sh
          ! grep -q '^ProtectHome=read-only$' scripts/install-singbox.sh
          grep -q 'rollback_runtime' scripts/install-singbox.sh
          grep -q 'journalctl -u x-ui-singbox.service -n 100' scripts/install-singbox.sh
          grep -q 'startup stabilization' scripts/install-singbox.sh
