name: Validate V11.2 stats port

on:
  push:
    branches: [v11.2-stats-port]
  workflow_dispatch:

concurrency:
  group: v11-2-stats-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Xpatcher
        uses: actions/checkout@v7

      - name: Static smoke and installer guards
        shell: bash
        run: |
          set -euo pipefail
          ./tests/smoke.sh
          bash -n scripts/install-singbox.sh install.sh
          grep -q 'singbox-stats.addr' scripts/install-singbox.sh
          grep -q '62000-62999' scripts/install-singbox.sh
          grep -q 'failed to update existing sing-box stats address' scripts/install-singbox.sh
          grep -q 'loadStatsListenAddress' overlay/internal/singbox/stats.go
          grep -q 'statsListenAddressFile.*singbox-stats.addr' overlay/internal/singbox/stats.go
          ! grep -q '^const StatsListenAddress' overlay/internal/singbox/stats.go

      - name: Download matching 3x-ui source
        shell: bash
        run: |
          set -euo pipefail
          target=$(tr -d '\r\n' < UPSTREAM_COMPAT)
          mkdir source
          curl -fL --retry 5 --retry-all-errors "https://codeload.github.com/MHSanaei/3x-ui/tar.gz/${target}" -o /tmp/3x-ui.tar.gz
          tar -xzf /tmp/3x-ui.tar.gz -C source --strip-components=1

      - name: Apply overlay and unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/apply-overlay.sh "$GITHUB_WORKSPACE/source"
          cp internal/singbox/config_test.go source/internal/singbox/config_test.go
          cp overlay/internal/singbox/integrated_test.go source/internal/singbox/integrated_test.go
          cp overlay/internal/singbox/stats_test.go source/internal/singbox/stats_test.go

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: Test sing-box integration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/singbox -count=1
