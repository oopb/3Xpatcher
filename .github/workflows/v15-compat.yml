name: Validate 3x-ui v3.8.5 compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - UPSTREAM_COMPAT
      - internal/**
      - frontend/**
      - overlay/**
      - scripts/**
      - tests/**
      - .github/workflows/v15-compat.yml
  push:
    branches: [compat/3x-ui-v3.8.5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v15-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 3Xpatcher
        uses: actions/checkout@v7

      - name: Static patch smoke
        run: ./tests/smoke.sh

      - name: Download matching 3x-ui source
        shell: bash
        run: |
          set -euo pipefail
          target=$(tr -d '\r\n' < UPSTREAM_COMPAT)
          mkdir source
          curl -fL --retry 5 --retry-all-errors "https://codeload.github.com/MHSanaei/3x-ui/tar.gz/${target}" -o /tmp/3x-ui.tar.gz
          tar -xzf /tmp/3x-ui.tar.gz -C source --strip-components=1

      - name: Apply overlay
        run: |
          ./scripts/apply-overlay.sh "$GITHUB_WORKSPACE/source"
          cp overlay/internal/singbox/stats_test.go source/internal/singbox/stats_test.go

      - name: Assert selectable TUIC runtime isolation
        run: |
          set -euo pipefail
          grep -q 'job.NewTuicJob()' source/internal/web/web.go
          grep -q 'TUICRuntimeFromSettings(ib.Settings) == model.TUICRuntimeSingbox' source/internal/web/service/inbound_tuic.go
          grep -q 'IsSingboxOwnedInbound' source/internal/web/runtime/local.go
          grep -q "runtime: z.enum(\['native', 'singbox'\])" source/frontend/src/schemas/protocols/inbound/tuic.ts
          grep -q "value: 'native'" source/frontend/src/pages/inbounds/form/protocols/tuic.tsx
          grep -q "value: 'singbox'" source/frontend/src/pages/inbounds/form/protocols/tuic.tsx
          echo 'TUIC native/sing-box ownership selector is wired end-to-end'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: source/go.sum

      - name: Compile affected Go packages
        working-directory: source
        run: |
          go test -run '^$' ./internal/singbox
          go test -run '^$' ./internal/mieru
          go test -run '^$' ./internal/sub
          go test -run '^$' ./internal/web/service
          go test -run '^$' ./internal/web/runtime

      - name: Supplemental stats regression tests
        working-directory: source
        run: |
          go test ./internal/singbox -run '^(TestLoadStatsListenAddress|TestApplyStatsSnapshot.*)$' -count=1 -v

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Frontend typecheck and production build
        working-directory: source/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Compile panel web package after frontend build
        working-directory: source
        run: go test -run '^$' ./internal/web
