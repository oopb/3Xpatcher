name: Validate XHTTP download split

on:
  push:
    branches: [feat/xhttp-download-settings, fix/xhttp-download-toggle, feat/xhttp-managed-reality-gateway, fix/xhttp-managed-listener-snapshot]
  pull_request:
    paths:
      - scripts/v26-xhttp-download-settings.py
      - scripts/v27-xhttp-managed-gateway.py
      - scripts/v28-xhttp-managed-listener-fix.py
      - scripts/v29-xhttp-port-conflict.py
      - scripts/v30-xhttp-security-context.py
      - scripts/v31-xhttp-managed-lifecycle.py
      - overlay/internal/web/service/xhttp_managed_port_conflict_test.go
      - overlay/internal/sub/xhttp_download*.go
      - overlay/internal/web/service/xhttp_managed_gateway*.go
      - overlay/frontend/src/test/xhttp-download*.test.*
      - scripts/apply-overlay.sh
      - .github/workflows/xhttp-download-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xhttp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          version=$(cat UPSTREAM_COMPAT)
          curl -fsSL --retry 5 --retry-all-errors "https://codeload.github.com/MHSanaei/3x-ui/tar.gz/$version" -o /tmp/upstream.tar.gz
          tar -xzf /tmp/upstream.tar.gz -C source --strip-components=1
      - name: Apply overlay and XHTTP split patch
        run: |
          python3 -m py_compile scripts/v26-xhttp-download-settings.py scripts/v29-xhttp-port-conflict.py scripts/v30-xhttp-security-context.py scripts/v31-xhttp-managed-lifecycle.py
          ./scripts/apply-overlay.sh "$GITHUB_WORKSPACE/source"
          cp overlay/internal/sub/xhttp_download_test.go source/internal/sub/xhttp_download_test.go
          cp overlay/internal/web/service/xhttp_managed_gateway_test.go source/internal/web/service/xhttp_managed_gateway_test.go
          cp overlay/internal/web/service/xhttp_managed_port_conflict_test.go source/internal/web/service/xhttp_managed_port_conflict_test.go
          cp overlay/frontend/src/test/xhttp-download-toggle.test.tsx source/frontend/src/test/xhttp-download-toggle.test.tsx
          cp overlay/frontend/src/test/xhttp-download-wire.test.ts source/frontend/src/test/xhttp-download-wire.test.ts
          cp overlay/frontend/src/test/xhttp-download-share-link.test.ts source/frontend/src/test/xhttp-download-share-link.test.ts
          grep -q "downloadSettings" source/frontend/src/pages/inbounds/form/transport/xhttp.tsx
          grep -q "xhttpClientDownload" source/internal/sub/clash_service.go
          ! grep -q 'shadowrocketXHTTP' source/internal/sub/service.go
          ! grep -q 'params.set(\x27obfsParam\x27' source/frontend/src/lib/xray/inbound-link.ts
          ! grep -q 'params.set(\x27obfs\x27, \x27xhttp\x27)' source/frontend/src/lib/xray/inbound-link.ts
          grep -q 'managedXHTTPNeedsReconcile(&running, oldInbound)' source/internal/web/service/inbound.go
          grep -q 'managedXHTTPNeedsReconcile(&ib, nil)' source/internal/web/service/inbound.go
          grep -q 'managedXHTTPNeedsReconcile(nil, inbound)' source/internal/web/service/inbound.go
      - uses: actions/setup-go@v7
        with:
          go-version-file: source/go.mod
          cache: true
          cache-dependency-path: source/go.sum
      - name: Test XHTTP exports and compile dependent packages
        working-directory: source
        run: |
          go test ./internal/sub -run '^TestXhttpDownload' -count=1
          go test ./internal/web/service -run '^(TestXHTTPManagedGateway|TestXHTTPManagedPort)' -count=1
      - uses: actions/setup-node@v7
        with:
          node-version-file: source/.nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Typecheck and build native frontend
        working-directory: source/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test -- src/test/xhttp-download-toggle.test.tsx src/test/xhttp-download-wire.test.ts src/test/xhttp-download-share-link.test.ts
          npm run build
